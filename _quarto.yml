project:
  type: website
  output-dir: docs
  pre-render:  # This can be deleted if you are using the manually curated list of publications in publications.qmd
    - python3 xlsx_to_yml.py  # Automatically generate publications.yml from publications.xlsx

# Meta
description-meta: "Quarto Academic Website Template adapted by Dr. Gang He"
author-meta: "Daniel Jang"

website:
  title: "Daniel Jang"
  image: "https://quarto.org/quarto.png"
  description: "Personal Website"

  navbar:
    background: '#011F5B'

    left:   # You can comment out all navigation items here if you just like to keep the index page only
#      - text: Home
#        href: index.qmd
      - text: Posts
        menu:
          - text: Notes
            href: posts.qmd#category=Notes
          - text: News
            href: posts.qmd#category=News
          - text: Projects
            href: posts.qmd#category=Projects
      - text: Research
        menu:
          - text: Select Publications  # Automatically generated from publications.xlsx
            href: pub-listing.qmd
          - text: Pre-Prints + Recent Publications  # Manually curated list of publications
            href: publications.qmd
          - text: Software  # Manually curated list of publications
            href: publications.qmd
          #- text: Grants
          #  href: projects.qmd
      - text: Myself
        menu:
          - text: America Travel Map
            href: pub-listing.qmd
          - text: Music Portfolio
            href: publications.qmd
          - text: Photography Portfolio
            href: publications.qmd
      #- text: Teaching # Comment the Teaching part out to remove the Teaching page
      #  href: teaching.qmd
      #- text: Outreach
      #  menu:
      #    - text: Presentations
      #      href: posts.qmd#category=presentation
      #- text: Group   # Comment the Group part out to remove the Group page
      #  href: people.qmd

    right:
      - text: CV
        href: files/nsf-biosketch.pdf
      - icon: github
        href: https://github.com/jangjdaniel
        target: _blank
      - icon: rss
        href: posts.xml
        target: _blank

  page-navigation: true

  page-footer:
    left: "[Daniel Jang](http://www.github.com) &copy; <script>document.write(new Date().getFullYear())</script>"
    center: "Build on [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template) adapted by [Dr. Gang He](http://drganghe.github.io)"
    right:
      - icon: github
        href: https://github.com/drganghe/quarto-academic-website-template
        target: _blank
      - text: "{{< fa brands bluesky >}}"
        href: https://bsky.app
        target: _blank
      - icon: rss
        href: posts.xml
        target: _blank

  search:
    location: navbar
    type: textbox

  reader-mode: true

  draft-mode: unlinked

  repo-url: https://github.com/drganghe/quarto-academic-website-template
#  repo-actions: [edit, issue, source]

  open-graph: true

  twitter-card: true
#  card-style: summary

  site-url: "https://drganghe.github.io/quarto-academic-website-template"

  google-analytics:
    tracking-id: ""  # Please delete or replace with your own tracking ID
    anonymize-ip: true

bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"